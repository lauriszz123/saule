<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" role="img" aria-label="Saule">
  <title>Saule</title>
  <!--
    The 16px form, for an editor's file-type gutter. Everything that cannot
    survive at this size is gone: the orbit reads as a stray scratch and the
    gradients band, so the ring is dropped, the fills are flat, and the sea is
    two bands. The crescent is deliberately fatter than scale would suggest —
    at true proportion its lit edge is under a pixel and disappears.
  -->
  <path d="M1.6 10.4a6.4 6.4 0 0 1 12.8 0Z" fill="#F7A224"/>
  <ellipse cx="8" cy="11.1" rx="7.1" ry="0.85" fill="#F7A224"/>
  <ellipse cx="8" cy="13.2" rx="4.2" ry="0.8" fill="#F7A224" opacity="0.72"/>
  <ellipse cx="8" cy="15" rx="2" ry="0.6" fill="#F7A224" opacity="0.5"/>

  <!-- Two arcs, not a mask: no ids at all in this file, so nothing can collide
       when it is inlined next to the other two. -->
  <path d="M11.3764 0.2779A3.4 3.4 0 1 0 15.3754 4.5121A3 3 0 0 1 11.3764 0.2779Z"
        fill="#FFE3A0"/>
</svg>
