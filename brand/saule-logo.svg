<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="Saulė">
  <title>Saulė</title>
  <!--
    The Saule logo. "Saulė" is Lithuanian for sun; the crescent riding the orbit
    is Lua, whose name is Portuguese for moon — the language the syntax comes
    from is still up there, it is just daylight now.

    Transparent by design: no background rect, and the wordmark is real outlines
    (Avenir Next Bold, converted to paths) rather than a <text> element, so it
    renders identically wherever it lands and needs no font installed.
  -->
  <defs>
    <linearGradient id="sun" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="0.55" stop-color="#FBAE34"/>
      <stop offset="1" stop-color="#EF7F25"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBAE34"/>
      <stop offset="1" stop-color="#EF7F25"/>
    </linearGradient>

    <linearGradient id="moonFace" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset="1" stop-color="#FFD98A"/>
    </linearGradient>

    <!--
      There is deliberately no glow around the moon. The reference sketch had
      one, but it was drawn on a fixed dark background. On a transparent logo
      the crescent's unlit side is a hole, so a halo rings that hole in light
      and the hole itself fills with whatever is behind — which on a dark
      README reads as a black ball wearing a halo, not a crescent. Without it
      the crescent is crisp on both themes, which is the whole point.
    -->


    <!-- The wordmark ink: a warm near-black, lifted very slightly at the top. -->
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1D0E"/>
      <stop offset="1" stop-color="#0C0803"/>
    </linearGradient>

    <!--
      The shine. A single pass of white across the upper half, gone by 60%, with
      a whisper of warm bounce at the very bottom where the sun sits behind the
      letters. Enough to read as polished; not enough to read as glass.
    -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.34" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#FFCE7A" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFCE7A" stop-opacity="0.16"/>
    </linearGradient>

    <!-- The orbit is only drawn above the waterline; the sea takes the rest. -->
    <clipPath id="aboveHorizon">
      <rect x="0" y="0" width="512" height="300"/>
    </clipPath>

    <!-- …and it breaks around the moon, so the ring reads as passing behind it
         rather than being drawn across its face and through the crescent's
         open side, which is transparent and would otherwise let the ring
         through. -->
    <mask id="orbitBreak">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <circle cx="393" cy="77" r="56" fill="#000"/>
    </mask>

    <!-- Crescent: a disc with a second disc bitten out of its upper right, so
         the lit edge faces down-left, towards the sun. -->
    <mask id="crescent">
      <circle cx="393" cy="77" r="44" fill="#fff"/>
      <circle cx="414" cy="58" r="42" fill="#000"/>
    </mask>

    <path id="wordmark" d="M0.4470 -0.5240Q0.4250 -0.5520 0.3895 -0.5685Q0.3540 -0.5850 0.3210 -0.5850Q0.3040 -0.5850 0.2865 -0.5820Q0.2690 -0.5790 0.2550 -0.5705Q0.2410 -0.5620 0.2315 -0.5485Q0.2220 -0.5350 0.2220 -0.5140Q0.2220 -0.4960 0.2295 -0.4840Q0.2370 -0.4720 0.2515 -0.4630Q0.2660 -0.4540 0.2860 -0.4465Q0.3060 -0.4390 0.3310 -0.4310Q0.3670 -0.4190 0.4060 -0.4045Q0.4450 -0.3900 0.4770 -0.3660Q0.5090 -0.3420 0.5300 -0.3065Q0.5510 -0.2710 0.5510 -0.2180Q0.5510 -0.1570 0.5285 -0.1125Q0.5060 -0.0680 0.4680 -0.0390Q0.4300 -0.0100 0.3810 0.0040Q0.3320 0.0180 0.2800 0.0180Q0.2040 0.0180 0.1330 -0.0085Q0.0620 -0.0350 0.0150 -0.0840L0.1270 -0.1980Q0.1530 -0.1660 0.1955 -0.1445Q0.2380 -0.1230 0.2800 -0.1230Q0.2990 -0.1230 0.3170 -0.1270Q0.3350 -0.1310 0.3485 -0.1400Q0.3620 -0.1490 0.3700 -0.1640Q0.3780 -0.1790 0.3780 -0.2000Q0.3780 -0.2200 0.3680 -0.2340Q0.3580 -0.2480 0.3395 -0.2595Q0.3210 -0.2710 0.2935 -0.2805Q0.2660 -0.2900 0.2310 -0.3010Q0.1970 -0.3120 0.1645 -0.3270Q0.1320 -0.3420 0.1065 -0.3655Q0.0810 -0.3890 0.0655 -0.4225Q0.0500 -0.4560 0.0500 -0.5040Q0.0500 -0.5630 0.0740 -0.6050Q0.0980 -0.6470 0.1370 -0.6740Q0.1760 -0.7010 0.2250 -0.7135Q0.2740 -0.7260 0.3240 -0.7260Q0.3840 -0.7260 0.4465 -0.7040Q0.5090 -0.6820 0.5560 -0.6390Z M0.9490 -0.2170H0.9280Q0.9010 -0.2170 0.8735 -0.2145Q0.8460 -0.2120 0.8245 -0.2050Q0.8030 -0.1980 0.7890 -0.1845Q0.7750 -0.1710 0.7750 -0.1490Q0.7750 -0.1350 0.7815 -0.1250Q0.7880 -0.1150 0.7980 -0.1090Q0.8080 -0.1030 0.8210 -0.1005Q0.8340 -0.0980 0.8460 -0.0980Q0.8960 -0.0980 0.9225 -0.1255Q0.9490 -0.1530 0.9490 -0.2000ZM0.6480 -0.4300Q0.6920 -0.4720 0.7505 -0.4930Q0.8090 -0.5140 0.8700 -0.5140Q0.9330 -0.5140 0.9765 -0.4985Q1.0200 -0.4830 1.0470 -0.4505Q1.0740 -0.4180 1.0865 -0.3685Q1.0990 -0.3190 1.0990 -0.2510V0.0000H0.9490V-0.0530H0.9460Q0.9270 -0.0220 0.8885 -0.0050Q0.8500 0.0120 0.8050 0.0120Q0.7750 0.0120 0.7430 0.0040Q0.7110 -0.0040 0.6845 -0.0220Q0.6580 -0.0400 0.6410 -0.0700Q0.6240 -0.1000 0.6240 -0.1440Q0.6240 -0.1980 0.6535 -0.2310Q0.6830 -0.2640 0.7295 -0.2820Q0.7760 -0.3000 0.8330 -0.3060Q0.8900 -0.3120 0.9440 -0.3120V-0.3200Q0.9440 -0.3570 0.9180 -0.3745Q0.8920 -0.3920 0.8540 -0.3920Q0.8190 -0.3920 0.7865 -0.3770Q0.7540 -0.3620 0.7310 -0.3410Z M1.5490 0.0000V-0.0690H1.5470Q1.5380 -0.0520 1.5235 -0.0370Q1.5090 -0.0220 1.4895 -0.0110Q1.4700 0.0000 1.4465 0.0070Q1.4230 0.0140 1.3970 0.0140Q1.3470 0.0140 1.3125 -0.0040Q1.2780 -0.0220 1.2565 -0.0505Q1.2350 -0.0790 1.2255 -0.1155Q1.2160 -0.1520 1.2160 -0.1900V-0.4980H1.3810V-0.2280Q1.3810 -0.2070 1.3840 -0.1880Q1.3870 -0.1690 1.3955 -0.1540Q1.4040 -0.1390 1.4180 -0.1305Q1.4320 -0.1220 1.4550 -0.1220Q1.4980 -0.1220 1.5205 -0.1540Q1.5430 -0.1860 1.5430 -0.2290V-0.4980H1.7070V0.0000Z M1.8370 0.0000V-0.7560H2.0030V0.0000Z M2.4760 -0.3060Q2.4760 -0.3450 2.4515 -0.3730Q2.4270 -0.4010 2.3780 -0.4010Q2.3540 -0.4010 2.3340 -0.3935Q2.3140 -0.3860 2.2990 -0.3730Q2.2840 -0.3600 2.2750 -0.3425Q2.2660 -0.3250 2.2650 -0.3060ZM2.6270 -0.2430Q2.6270 -0.2330 2.6270 -0.2230Q2.6270 -0.2130 2.6260 -0.2040H2.2650Q2.2670 -0.1830 2.2775 -0.1660Q2.2880 -0.1490 2.3045 -0.1365Q2.3210 -0.1240 2.3415 -0.1170Q2.3620 -0.1100 2.3840 -0.1100Q2.4230 -0.1100 2.4500 -0.1245Q2.4770 -0.1390 2.4940 -0.1620L2.6080 -0.0900Q2.5730 -0.0390 2.5155 -0.0115Q2.4580 0.0160 2.3820 0.0160Q2.3260 0.0160 2.2760 -0.0015Q2.2260 -0.0190 2.1885 -0.0525Q2.1510 -0.0860 2.1295 -0.1350Q2.1080 -0.1840 2.1080 -0.2470Q2.1080 -0.3080 2.1290 -0.3575Q2.1500 -0.4070 2.1860 -0.4415Q2.2220 -0.4760 2.2710 -0.4950Q2.3200 -0.5140 2.3770 -0.5140Q2.4320 -0.5140 2.4780 -0.4955Q2.5240 -0.4770 2.5570 -0.4420Q2.5900 -0.4070 2.6085 -0.3570Q2.6270 -0.3070 2.6270 -0.2430ZM2.4700 -0.6570Q2.4700 -0.6210 2.4440 -0.5965Q2.4180 -0.5720 2.3800 -0.5720Q2.3420 -0.5720 2.3165 -0.5970Q2.2910 -0.6220 2.2910 -0.6570Q2.2910 -0.6920 2.3165 -0.7175Q2.3420 -0.7430 2.3800 -0.7430Q2.4180 -0.7430 2.4440 -0.7180Q2.4700 -0.6930 2.4700 -0.6570Z"/>
  </defs>

  <!-- Orbit, behind everything, cut off at the waterline. -->
  <g clip-path="url(#aboveHorizon)" mask="url(#orbitBreak)">
    <ellipse cx="256" cy="220" rx="232" ry="96" transform="rotate(-30 256 220)"
             fill="none" stroke="#F6A32C" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- The sun, rising: a half disc sitting on the horizon. -->
  <path d="M81 300a175 175 0 0 1 350 0Z" fill="url(#sun)"/>

  <!-- Wordmark, struck across the sun. -->
  <g transform="translate(118.6 272) scale(104)">
    <use href="#wordmark" fill="url(#ink)"/>
    <use href="#wordmark" fill="url(#gloss)"/>
  </g>

  <!-- Sea: the sun's reflection breaking up as it travels towards the viewer. -->
  <g fill="url(#water)">
    <ellipse cx="256" cy="308" rx="240" ry="9"/>
    <ellipse cx="256" cy="339" rx="180" ry="11" opacity="0.92"/>
    <ellipse cx="256" cy="371" rx="136" ry="10" opacity="0.82"/>
    <ellipse cx="256" cy="402" rx="99" ry="10" opacity="0.71"/>
    <ellipse cx="256" cy="431" rx="69" ry="9" opacity="0.59"/>
    <ellipse cx="256" cy="458" rx="44" ry="8" opacity="0.46"/>
    <ellipse cx="256" cy="483" rx="24" ry="6" opacity="0.33"/>
  </g>

  <!-- The moon, on the orbit, in front of it. -->
  <g mask="url(#crescent)">
    <circle cx="393" cy="77" r="44" fill="url(#moonFace)"/>
  </g>
</svg>
