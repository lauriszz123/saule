[package]
name = "saule-cli"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[[bin]]
name = "saule"
path = "src/main.rs"

[dependencies]
saule-ast = { path = "../saule-ast" }
saule-db = { path = "../saule-db" }
saule-project = { path = "../saule-project" }
saule-version = { path = "../saule-version" }
saule-lexer = { path = "../saule-lexer" }
saule-parser = { path = "../saule-parser" }
saule-semantic = { path = "../saule-semantic" }
saule-interpreter = { path = "../saule-interpreter" }
# The CLI is where the engine is selected (VM_DESIGN.md 22.4), so it is
# the one binary that depends on both.
saule-vm = { path = "../saule-vm" }
saule-fmt = { path = "../saule-fmt" }
miette = { version = "7.6.0", features = ["fancy"] }
clap = { version = "4.6.4", features = ["derive"] }

[features]
# Passthrough for `--profile-bytecode` (`VM_DESIGN.md` §16). Off by
# default, and deliberately so — see the comment on `saule-vm`'s feature of
# the same name for the measurement behind that.
profile = ["saule-vm/profile"]
