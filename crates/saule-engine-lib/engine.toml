# `engine` — example native package manifest.
#
# This is the canonical manifest for the engine package. The crate's
# `build.rs` copies it next to the compiled library in the Cargo artifact
# directory (`target/<profile>/engine.toml`) on every build, so install
# scripts can pick it up from there instead of a hand-maintained path.
#
# Install location: ~/.saule/native_manifests/engine.toml
# The compiled binary goes in:  ~/.saule/native_packages/
#
# The interpreter discovers this manifest at startup, registers the type
# signatures below (so `Graphics.circle(...)` type-checks with full LSP
# support), and lazily loads the shared library the first time you
# `import` the package.

[package]
name = "engine"
version = "0.1.0"
# Comma-separated candidate filenames. The interpreter prefers the one
# matching the host OS (.dll on Windows, .so on Linux, .dylib on macOS) and
# falls back to whichever exists.
binary = "saule_engine_lib.so, saule_engine_lib.dll, saule_engine_lib.dylib"

[exports.Graphics]
type = "class"
doc = "2D graphics rendering."

[[exports.Graphics.methods]]
name = "setColor"
sig = "fn(r: float, g: float, b: float) -> nil"
native_symbol = "saule_engine_graphics_set_color"

[[exports.Graphics.methods]]
name = "circle"
sig = "fn(mode: string, x: float, y: float, radius: float) -> nil"
native_symbol = "saule_engine_graphics_circle"

[[exports.Graphics.methods]]
name = "rectangle"
sig = "fn(mode: string, x: float, y: float, w: float, h: float) -> nil"
native_symbol = "saule_engine_graphics_rectangle"

[[exports.Graphics.methods]]
name = "line"
sig = "fn(x1: float, y1: float, x2: float, y2: float) -> nil"
native_symbol = "saule_engine_graphics_line"

[[exports.Graphics.methods]]
name = "setLineWidth"
sig = "fn(width: float) -> nil"
native_symbol = "saule_engine_graphics_set_line_width"

[[exports.Graphics.methods]]
name = "clear"
sig = "fn(r: float, g: float, b: float) -> nil"
native_symbol = "saule_engine_graphics_clear"

[[exports.Graphics.methods]]
name = "present"
sig = "fn() -> nil"
native_symbol = "saule_engine_graphics_present"

[exports.Window]
type = "class"
doc = "Window management."

[[exports.Window.methods]]
name = "create"
sig = "fn(width: integer, height: integer, title: string?) -> nil"
native_symbol = "saule_engine_window_create"

[[exports.Window.methods]]
name = "isOpen"
sig = "fn() -> boolean"
native_symbol = "saule_engine_window_is_open"

[[exports.Window.methods]]
name = "pollEvents"
sig = "fn() -> nil"
native_symbol = "saule_engine_window_poll_events"

[[exports.Window.methods]]
name = "close"
sig = "fn() -> nil"
native_symbol = "saule_engine_window_close"

[[exports.Window.methods]]
name = "getSize"
sig = "fn() -> (integer, integer)"
native_symbol = "saule_engine_window_get_size"

[exports.Timer]
type = "class"
doc = "Timing helpers."

[[exports.Timer.methods]]
name = "getTime"
sig = "fn() -> float"
native_symbol = "saule_engine_timer_get_time"

[[exports.Timer.methods]]
name = "getDelta"
sig = "fn() -> float"
native_symbol = "saule_engine_timer_get_delta"

[exports.Mouse]
type = "class"
doc  = "Mouse position and button state."
 
[[exports.Mouse.methods]]
name          = "getPos"
sig           = "fn() -> (float, float)"
native_symbol = "saule_engine_mouse_get_pos"
 
[[exports.Mouse.methods]]
name          = "isDown"
sig           = "fn(button: integer) -> boolean"
native_symbol = "saule_engine_mouse_is_down"

[exports.Keyboard]
type = "class"
doc  = "Keyboard polling by key name."
 
[[exports.Keyboard.methods]]
name          = "isDown"
sig           = "fn(key: string) -> boolean"
native_symbol = "saule_engine_keyboard_is_down"
