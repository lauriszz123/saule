[package]
name = "saule-runtime"
version.workspace = true
edition.workspace = true
description = "Saule — the runtime the bytecode VM runs programs on: values, the standard library, native packages, and module resolution."
license.workspace = true

[dependencies]
saule-ast = { path = "../saule-ast" }
saule-project = { path = "../saule-project" }
saule-version = { path = "../saule-version" }
saule-lexer = { path = "../saule-lexer" }
saule-parser = { path = "../saule-parser" }
saule-semantic = { path = "../saule-semantic" }
saule-typeck = { path = "../saule-typeck" }
saule-native-abi = { path = "../saule-native-abi" }
miette = "7.6.0"
thiserror = "2.0.18"
toml = "0.8"
# Reads a native package's metadata records out of its library file —
# the export table and the bytes behind it — without loading the library.
# Read-only, and only the three formats packages ship in. Not optional:
# discovery is the half of native packages that also runs on wasm, so the
# checker there knows an installed package's types.
#
# `unaligned` is not optional either. Without it `object` reads headers in
# place and needs the buffer aligned for them, and `std::fs::read` promises
# only byte alignment — so whether a package parsed came down to where the
# allocator happened to put the file.
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "macho", "pe", "coff", "std", "unaligned"] }
# Optional so the runtime can target `wasm32-unknown-unknown`, where
# there is no such thing as a dynamically-loaded shared library. Everything
# else in the crate already compiles for wasm; this was the only blocker.
libloading = { version = "0.8", optional = true }

[features]
default = ["native-packages"]
# Loading third-party native packages (`~/.saule/native_packages/*.so|dylib|dll`)
# at run time. On by default, so the CLI, the LSP and every existing build are
# unaffected — turn it off only for targets that cannot dlopen, i.e. wasm.
# Package discovery and the type signatures it contributes stay available
# either way; only the actual library loading disappears.
native-packages = ["dep:libloading"]

[dev-dependencies]
saule-lexer = { path = "../saule-lexer" }
saule-parser = { path = "../saule-parser" }
saule-semantic = { path = "../saule-semantic" }
saule-typeck = { path = "../saule-typeck" }
