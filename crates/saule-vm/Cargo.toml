[package]
name = "saule-vm"
version.workspace = true
edition.workspace = true
description = "Saule — register-based bytecode compiler and virtual machine."
license.workspace = true

# Dependency direction is load-bearing (VM_DESIGN.md §22.1): `saule-vm`
# depends on `saule-interpreter`, never the reverse. The tree-walker must
# stay buildable — and testable — with this crate deleted from the
# workspace, because it is the differential oracle for every VM bug.
[dependencies]
saule-ast = { path = "../saule-ast" }
# `default-features = false` here, and re-exported as this crate's own
# `native-packages`, so `saule-wasm` can depend on the VM without dragging
# `libloading` in. Cargo unifies features across the graph, so the CLI --
# which asks for the interpreter's defaults directly -- still gets them.
saule-interpreter = { path = "../saule-interpreter", default-features = false }
# The front end, for `program.rs`: compiling a program means resolving the
# import graph here rather than at run time, so this crate reads and parses
# the imported files itself. Both sit *below* `saule-interpreter` in the
# graph, so §22.1's one-way arrow is untouched.
saule-lexer = { path = "../saule-lexer" }
saule-parser = { path = "../saule-parser" }
saule-semantic = { path = "../saule-semantic" }
saule-typeck = { path = "../saule-typeck" }
miette = "7.6.0"
thiserror = "2.0.18"

[features]
default = ["native-packages"]
# Passthrough to `saule-interpreter`'s feature of the same name. See the
# comment on the dependency above.
native-packages = ["saule-interpreter/native-packages"]
