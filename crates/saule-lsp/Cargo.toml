[package]
name = "saule-lsp"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[[bin]]
name = "saule-lsp"
path = "src/main.rs"

[dependencies]
saule-ast = { path = "../saule-ast" }
saule-version = { path = "../saule-version" }
saule-docs = { path = "../saule-docs" }
saule-lexer = { path = "../saule-lexer" }
saule-parser = { path = "../saule-parser" }
saule-semantic = { path = "../saule-semantic" }
saule-typeck = { path = "../saule-typeck" }
saule-interpreter = { path = "../saule-interpreter" }
saule-fmt = { path = "../saule-fmt" }
miette = "7.6.0"
tower-lsp = "0.20"
tokio = { version = "1", features = [
	"rt-multi-thread",
	"io-std",
	# `io-util` carries the AsyncRead/AsyncWrite extension traits and
	# `duplex`, which `transport::sanitize` is built on.
	"io-util",
	"macros",
	"sync",
] }
dashmap = "6"
# For `Registration.register_options`, which is a raw `serde_json::Value`.
serde_json = "1"
