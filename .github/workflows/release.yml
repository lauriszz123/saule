name: Release

# Build the toolchain for every supported platform and publish it as a GitHub
# Release, which is what `install.sh` downloads from.
#
# Two ways in:
#
#   * **Run it from the Actions tab** (or `gh workflow run release.yml`). The
#     version is generated — `scripts/next-version.sh` reads the existing tags
#     and takes the next build number — and the tag is created here. Nobody
#     types a version number, so nobody can fat-finger one or reuse one.
#
#   * **Push a `v26.7` tag by hand.** The version comes from the tag. This is
#     the escape hatch for re-cutting a release whose build failed for an
#     infrastructure reason.
#
# The tag created by the first path does not re-trigger this workflow: events
# raised by `GITHUB_TOKEN` deliberately do not start new workflow runs, which
# is what keeps the two entry points from chaining into each other.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 26.7. Leave blank to use the next build number.'
        required: false
        type: string
      dry_run:
        description: 'Build everything but create no tag and no release.'
        required: false
        default: false
        type: boolean
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

# Two releases building at once would race for the same tag and produce two
# artifact sets claiming one version. Queue them instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      # What the build jobs check out. The new tag normally, but a dry run
      # creates no tag, so it falls back to the commit that triggered the run.
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      # Tags are the source of the build number, and the default shallow
      # fetch has none of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # Triggered by a tag push: the tag is the answer.
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          elif [ -n "$REQUESTED" ]; then
            version="${REQUESTED#v}"
            tag="v$version"
          else
            version="$(scripts/next-version.sh)"
            tag="v$version"
          fi

          # One shape only. `26.7` — no patch component, no pre-release
          # suffix, no `v` left in the version itself.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::\`$version\` is not a <year>.<build> version (e.g. 26.7)"
            exit 1
          fi

          # A release takes its year from the version being built, but *dev*
          # builds take theirs from Cargo.toml. Letting the two disagree would
          # mean that after releasing 27.1, every local build still called
          # itself 26.something. Caught here, where the fix is one line.
          year_of_record="$(scripts/next-version.sh --year)"
          if [ "${version%%.*}" != "$year_of_record" ]; then
            echo "::error::$version disagrees with the year in Cargo.toml ($year_of_record). Set [workspace.package] version to ${version%%.*}.0.0 first."
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] || [ "$DRY_RUN" = "true" ]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
          fi

          echo "Releasing **$version** (tag \`$tag\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to overwrite an existing release
        if: github.ref_type != 'tag'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists. A published version is never rebuilt — cut the next build number instead."
            exit 1
          fi

      - name: Create and push the tag
        if: github.ref_type != 'tag' && inputs.dry_run != true
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Saule $VERSION"
          git push origin "$TAG"

  build:
    name: ${{ matrix.triple }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not hide whether the others are fine —
      # the release job won't publish a partial set anyway.
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            triple: aarch64-apple-darwin
          - runner: macos-13
            triple: x86_64-apple-darwin
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          # Native arm64 runner, so no cross-compilation toolchain is needed.
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          # Statically linked: the one build that runs on distros whose glibc
          # is older than the runner's, and inside Alpine-based containers.
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-musl
            apt: musl-tools
          - runner: windows-2022
            triple: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          # saule-version's build script reads tags. It would fall back
          # gracefully, but $SAULE_VERSION below is what actually decides.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: Install the musl linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        env:
          # The one input that decides what the binaries report. Everything
          # else — `saule --version`, `Saule.version`, the LSP handshake —
          # reads it back out of the binary.
          SAULE_VERSION: ${{ needs.resolve.outputs.version }}
        run: cargo build --release --locked --target ${{ matrix.triple }} -p saule-cli -p saule-lsp

      # Every triple in the matrix is native to its runner (the musl build is
      # static, so it runs on the glibc host), so all six can be executed here
      # rather than shipped unverified.
      - name: Check the binaries report the version we asked for
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          bin="target/${{ matrix.triple }}/release/saule"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          got="$("$bin" --version)"
          echo "$bin --version -> $got"
          # A dev-marked or misnumbered binary in a release archive is the one
          # failure that would be invisible until a user reported it.
          if [ "$got" != "saule $VERSION" ]; then
            echo "::error::expected \`saule $VERSION\`, got \`$got\`"
            exit 1
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          name="saule-$VERSION-$TRIPLE"
          staging="dist/$name"
          mkdir -p "$staging"

          src="target/$TRIPLE/release"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "$src/saule.exe" "$src/saule-lsp.exe" "$staging/"
          else
            cp "$src/saule" "$src/saule-lsp" "$staging/"
          fi
          cp README.md "$staging/"
          # Written as an `if` rather than `[ -f LICENSE ] && cp …`: under
          # `set -e` a failing `&&` chain in tail position aborts the job, so
          # the terse spelling would break every build until LICENSE exists.
          if [ -f LICENSE ]; then
            cp LICENSE "$staging/"
          else
            echo "::warning::no LICENSE file — see RELEASE_PLAN.md step 1. Archives are not redistributable without one."
          fi

          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -la

      # Action major versions here follow the same era as the ones already in
      # use by deploy-www.yml. Confirm both on the first run — a wrong major is
      # an immediate, obvious "unable to resolve action" failure, not a subtle one.
      - uses: actions/upload-artifact@v5
        with:
          name: saule-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: [resolve, build]
    # A dry run proves the matrix builds; it deliberately publishes nothing.
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Checksum every artifact
        working-directory: dist
        run: |
          set -euo pipefail
          # `install.sh` refuses to install anything it cannot verify against
          # this file, so it is a required asset rather than a nicety.
          #
          # The archives are listed explicitly rather than with `./*`: on a
          # re-run of this job a stale SHA256SUMS would otherwise end up
          # checksumming itself.
          sha256sum saule-*.tar.gz saule-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          ## Install

          macOS / Linux:

          \`\`\`sh
          curl -fsSL https://lauriszz123.github.io/saule/install.sh | sh
          \`\`\`

          Windows (PowerShell):

          \`\`\`powershell
          irm https://lauriszz123.github.io/saule/install.ps1 | iex
          \`\`\`

          Then \`saule --version\` should print \`saule $VERSION\`.

          Every archive contains \`saule\` and \`saule-lsp\`. Verify a download
          against \`SHA256SUMS\` before unpacking it.
          EOF

          gh release create "$TAG" \
            --title "Saule $VERSION" \
            --notes-file "$notes" \
            --verify-tag \
            dist/*
