name: Deploy website

# Builds the Astro site in `www/` and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source → **GitHub Actions**. No branch or `gh-pages` push is involved; the
# artifact goes straight from this workflow to Pages.
on:
  push:
    branches: [main]
    # The site is generated from repo Markdown and the VS Code grammar, so a
    # README edit has to redeploy even though nothing under www/ changed.
    paths:
      - 'www/**'
      - 'README.md'
      - 'DOCS.md'
      - 'examples/**'
      - 'editors/vscode/syntaxes/**'
      # The playground ships a wasm build of the interpreter, so a change to
      # the language itself changes the site.
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/deploy-www.yml'
  # Lets a deploy be re-run by hand after changing Pages settings.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one. Queued runs still collapse to the
# most recent commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The playground is a WebAssembly build of the interpreter, so the site
      # cannot be built without a Rust toolchain and the wasm target.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        # Must match the `wasm-bindgen` crate version exactly — a mismatch is a
        # hard schema error, not a warning. Read it from the lockfile so the
        # two can never drift.
        run: |
          VERSION="$(grep -A 1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "Installing wasm-bindgen-cli $VERSION"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: www

      - name: Regenerate docs from repo Markdown
        # The generated pages under src/content/docs/{language,stdlib,examples}
        # are committed, but regenerating here means a README-only commit still
        # updates the site, and a stale commit can never ship.
        run: npm run sync-docs
        working-directory: www

      # `prebuild` compiles crates/saule-wasm and runs wasm-bindgen, so the
      # playground module is produced here rather than committed.
      - name: Build
        run: npm run build
        working-directory: www

      # v4+ excludes dotfiles from the artifact. Astro's output has none, so
      # `include-hidden-files` is deliberately not set — add it only if the
      # build starts emitting one.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
