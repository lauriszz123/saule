name: Deploy website

# Builds the Astro site in `www/` and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source → **GitHub Actions**. No branch or `gh-pages` push is involved; the
# artifact goes straight from this workflow to Pages.
on:
  push:
    branches: [main]
    # The site is generated from repo Markdown and the VS Code grammar, so a
    # README edit has to redeploy even though nothing under www/ changed.
    paths:
      - 'www/**'
      - 'README.md'
      - 'DOCS.md'
      - 'examples/**'
      - 'editors/vscode/syntaxes/**'
      - '.github/workflows/deploy-www.yml'
  # Lets a deploy be re-run by hand after changing Pages settings.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one. Queued runs still collapse to the
# most recent commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: www

      - name: Regenerate docs from repo Markdown
        # The generated pages under src/content/docs/{language,stdlib,examples}
        # are committed, but regenerating here means a README-only commit still
        # updates the site, and a stale commit can never ship.
        run: npm run sync-docs
        working-directory: www

      - name: Build
        run: npm run build
        working-directory: www

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
