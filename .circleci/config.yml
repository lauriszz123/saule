# Saule's CI/CD.
#
# CircleCI runs the compute; GitHub hosts the code and the release archives.
# That split is deliberate: `www/public/install.sh` downloads from
# `github.com/lauriszz123/saule/releases/download/...`, which is a plain
# anonymous download with no rate limit and a URL that never changes. Nothing
# in the installer knows or cares which CI built the binary.
#
# **`main` is the release branch, and every push to it publishes.** Test, then
# build all six platform archives, then create the GitHub Release — tag
# included — in one pipeline. The version generates itself from the existing
# tags (`scripts/next-version.sh`), so nobody types a version number, nobody
# can reuse one, and `install.sh` picks the new release up as `latest` the
# moment it exists.
#
# **Nothing runs on any other branch.** `develop` is yours to push to freely:
# the workflow's `when` below excludes it, so a push there starts no jobs and
# spends nothing. Two escape hatches for when you do want CI off `main`:
#
#   * `dry-run: true` — build all six, verify every binary reports the version
#     it claims and that the checksum set is complete, then stop without
#     touching GitHub. Triggerable from any branch; this is the rehearsal.
#   * `[skip ci]` in a commit message — CircleCI's own marker. A `main` push
#     carrying it starts no pipeline at all, which is how a README-only commit
#     avoids cutting a release.
#
# Cutting a release, the one-time project setup, and the `develop` workflow
# are CIRCLECI.md.

version: 2.1

orbs:
  win: circleci/windows@5.0

parameters:
  # Set from the "Trigger Pipeline" button or the API — see CIRCLECI.md. A
  # push to `main` sets no parameters at all and gets the full release path;
  # a dry run builds everything and publishes nothing.
  dry-run:
    type: boolean
    default: false
  # The escape hatch. Normally the version generates itself from the existing
  # tags (`scripts/next-version.sh`), so nobody types a version number and
  # nobody can fat-finger one or reuse one. Set this only to re-cut a release
  # whose build failed for an infrastructure reason.
  release-version:
    type: string
    default: ""

executors:
  rust:
    docker:
      - image: rust:1-bookworm
    environment:
      CARGO_TERM_COLOR: always

commands:
  # Dependency sources, keyed on the lockfile: they change only when it does,
  # and a stale-but-valid cache is worse than a cheap miss.
  #
  # `target/` is cached for the test workflow and deliberately *not* for
  # release builds. The release profile is fat LTO with one codegen unit, so a
  # cached artifact from a different toolchain patch is a plausible way to ship
  # a subtly different binary than the one that was tested. A release rebuilds
  # clean.
  #
  # The paths are the official `rust` image's, not `~/.cargo`: it sets
  # CARGO_HOME=/usr/local/cargo, so caching the home directory would cache
  # nothing at all and the miss would be silent.
  restore-cargo:
    parameters:
      prefix:
        type: string
    steps:
      - restore_cache:
          keys:
            - cargo-<< parameters.prefix >>-{{ checksum "Cargo.lock" }}
            - cargo-<< parameters.prefix >>-
  save-cargo:
    parameters:
      prefix:
        type: string
    steps:
      - save_cache:
          key: cargo-<< parameters.prefix >>-{{ checksum "Cargo.lock" }}
          paths:
            - /usr/local/cargo/registry
            - /usr/local/cargo/git
            - target

jobs:
  # ---------------------------------------------------------------------------
  # Test
  # ---------------------------------------------------------------------------

  # The gate on the Rust side of the repo. Deliberately one platform: the
  # release workflow builds all six triples, and that is where a
  # platform-specific break shows up. Running the full matrix on every push
  # would cost minutes to catch almost nothing.
  test:
    executor: rust
    steps:
      - checkout
      - restore-cargo:
          prefix: test
      - run:
          name: rustfmt — advisory
          command: |
            rustup component add rustfmt
            # NOT blocking, and deliberately so. The tree carries pre-existing
            # formatting drift that predates the existence of any CI to catch
            # it, and `main` publishes: a blocking gate here would mean no
            # release could ever be cut until the whole backlog was cleared in
            # one commit.
            #
            # Clearing it is not `cargo fmt --all` either — some files in this
            # repo are CRLF and a blanket reformat rewrites their line endings
            # along with everything else. Do it crate by crate, then flip this
            # step to a bare `cargo fmt --all --check`.
            if ! cargo fmt --all --check; then
              echo
              echo "note: formatting drift above. Advisory — see the comment in .circleci/config.yml."
            fi
      - run:
          name: clippy
          command: |
            rustup component add clippy
            # `saule-engine-lib` is excluded from the *toolchain* gate and
            # covered by `test-engine` instead. It is an example native package
            # rather than something the release workflow builds
            # (`-p saule-cli -p saule-lsp`), so a break there should not read
            # as a break in the compiler — but it is not unchecked either.
            cargo clippy --workspace --all-targets --exclude saule-engine-lib -- -D warnings
      - run:
          name: cargo test
          no_output_timeout: 30m
          command: cargo test --workspace --locked --exclude saule-engine-lib
      - run:
          name: Build the CLI for the fixture suite
          command: cargo build --locked -p saule-cli
      - run:
          name: .sau fixtures — both engines, and differentially
          no_output_timeout: 30m
          command: |
            # The fixtures under tests/ are the language's real regression
            # suite and are not reachable from `cargo test`.
            #
            # Since Phase 4 a bare run uses the bytecode VM, so the first of
            # these means something different than it used to and the other
            # three are no longer optional. Without them CI would gate on one
            # engine and stop noticing the other, which is the one thing the
            # differential design cannot survive: the tree-walker is the
            # oracle.
            ./run_tests.sh
            SAULE_ENGINE=interp ./run_tests.sh
            # Not redundant with the first: a fallback is silent under the
            # default and reported here, and this is the run whose notes the
            # harness counts.
            SAULE_ENGINE=vm ./run_tests.sh
            # The one that catches wrong *values*. Exit status cannot see a VM
            # bug that prints the wrong thing and still exits 0.
            SAULE_DIFF=1 ./run_tests.sh
            # Multi-module programs with imports and file IO, which is a
            # different question from the single-file fixtures above and the
            # one that has actually caught divergences. Through `bash` because
            # this one is not chmod +x in git, unlike run_tests.sh.
            bash run_examples_diff.sh
      - run:
          name: saule and saule-lsp agree on the version
          command: |
            set -eu
            # Three surfaces report the version and they are all fed by the
            # same crate; this catches a wiring mistake that no unit test
            # would, because each surface formats the value independently.
            cli="$(./target/debug/saule --version)"
            lsp="$(cargo run -q --locked -p saule-lsp -- --version)"
            echo "cli: $cli"
            echo "lsp: $lsp"
            if [ "${cli#saule }" != "${lsp#saule-lsp }" ]; then
              echo "error: saule and saule-lsp report different versions" >&2
              exit 1
            fi
      - save-cargo:
          prefix: test

  # The graphics package, gated separately from the toolchain.
  #
  # Nothing here needs a display: minifb's x11 path and `arboard` both dlopen
  # their libraries at *runtime*, the rasterizer tests operate on plain pixel
  # buffers, and the font tests skip themselves when the image has no typeface
  # installed. It also runs the manifest check — `engine.toml` is checked in
  # and copied verbatim by the install scripts, so a signature edited without
  # regenerating it would ship a package whose declared types disagree with
  # its code.
  test-engine:
    executor: rust
    steps:
      - checkout
      - restore-cargo:
          prefix: engine
      - run:
          name: clippy and tests for saule-engine-lib
          no_output_timeout: 30m
          command: |
            rustup component add clippy
            cargo clippy -p saule-engine-lib --all-targets -- -D warnings
            cargo test -p saule-engine-lib --locked
      - save-cargo:
          prefix: engine

  # Two guarantees, both easy to break by editing prose:
  #
  #   1. Every Saule sample the website shows by hand actually compiles and
  #      runs — checked against the real compiler built from this commit.
  #   2. The generated pages under www/src/content/docs are in sync with the
  #      README.md / DOCS.md / examples they come from, so a committed page can
  #      never contradict its source.
  check-www:
    executor: rust
    steps:
      - checkout
      - restore-cargo:
          prefix: www
      - run:
          name: Node 22, and the wasm toolchain the playground needs
          command: |
            set -eu
            # Nodesource rather than Debian's package: bookworm ships Node 18
            # and the site is built on 22.
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y --no-install-recommends nodejs
            node --version

            # `npm run build` fires a prebuild hook that compiles the
            # playground's WebAssembly, so the site cannot be built without
            # the wasm target and a wasm-bindgen CLI whose version matches the
            # `wasm-bindgen` crate *exactly* — a mismatch is a hard schema
            # error, not a warning. Read it from the lockfile so the two can
            # never drift.
            rustup target add wasm32-unknown-unknown
            V="$(grep -A 1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
            echo "wasm-bindgen $V"
            asset="wasm-bindgen-$V-x86_64-unknown-linux-musl"
            url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$V/$asset.tar.gz"
            # The prebuilt binary turns a three-minute compile into a
            # two-second download. `cargo install` stays as the fallback for
            # the day that asset name changes.
            if curl -fsSL "$url" | tar xz -C /tmp; then
              install -m 0755 "/tmp/$asset/wasm-bindgen" /usr/local/cargo/bin/wasm-bindgen
            else
              echo "prebuilt wasm-bindgen $V not available — building it"
              cargo install wasm-bindgen-cli --version "$V" --locked
            fi
            wasm-bindgen --version
      - run:
          name: Build the compiler the samples are checked against
          no_output_timeout: 30m
          # Debug, not release: these samples are a few lines each, and the
          # release profile is fat LTO with one codegen unit. `SAULE_BIN` in
          # the next step then names this binary explicitly, so a stale
          # `target/release/saule` restored from the cache can never be picked
          # up in its place — which is the whole point of checking samples
          # against the compiler from *this* commit.
          command: cargo build --locked -p saule-cli
      - run:
          name: Samples compile, generated docs are in sync, site builds
          command: |
            set -eu
            export SAULE_BIN="$PWD/target/debug/saule"
            cd www
            npm ci
            npm run check-samples
            npm run sync-docs
            # `git status --porcelain`, not `git diff`: a new `##` section in
            # the README generates a page that does not exist yet, and an
            # *untracked* file is invisible to `git diff`. That would let a new
            # documentation page pass CI and then be missing from the repo.
            changed="$(git status --porcelain -- src/content/docs)"
            if [ -n "$changed" ]; then
              echo "error: generated docs are stale. Run 'npm run sync-docs' in www/ and commit the result." >&2
              echo "$changed" >&2
              exit 1
            fi
            npm run build
      - save-cargo:
          prefix: www

  # ---------------------------------------------------------------------------
  # Release — decide the version once
  # ---------------------------------------------------------------------------

  # Every build job reads the version out of the workspace rather than
  # recomputing it. Six jobs each running `next-version.sh` could disagree if a
  # tag landed mid-pipeline, and the failure would be six archives that do not
  # all claim the same version.
  version:
    # No Rust involved — this job reads tags and writes two small files, so it
    # takes the small image rather than pulling the toolchain to run `sed`.
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Resolve the version this release will carry
          command: |
            set -eu

            if [ -n "<< pipeline.parameters.release-version >>" ]; then
              version="<< pipeline.parameters.release-version >>"
              version="${version#v}"
              override=1
            else
              version="$(bash scripts/next-version.sh)"
              override=
            fi

            # One shape only. `26.7` — no patch component, no pre-release
            # suffix, no `v` left in the version itself.
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+$'; then
              echo "error: \`$version\` is not a <year>.<build> version (e.g. 26.7)" >&2
              exit 1
            fi

            # A release takes its year from the version being built, but *dev*
            # builds take theirs from Cargo.toml. Letting the two disagree
            # would mean that after releasing 27.1, every local build still
            # called itself 26.something. Caught here, where the fix is one
            # line.
            year_of_record="$(bash scripts/next-version.sh --year)"
            if [ "${version%%.*}" != "$year_of_record" ]; then
              echo "error: $version disagrees with the year in Cargo.toml ($year_of_record)." >&2
              echo "       Set [workspace.package] version to ${version%%.*}.0.0 first." >&2
              exit 1
            fi

            # A published version is never rebuilt: the archives are immutable
            # once anyone has downloaded them. An auto-generated number that
            # collides means the tag list was read wrong, which is a bug worth
            # stopping for. An explicit `release-version` is allowed to reuse
            # an existing tag, because that is exactly the re-cut case — the
            # publish job still refuses if a *Release* already exists for it.
            if [ -z "$override" ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "error: tag v$version already exists. Cut the next build number instead." >&2
              exit 1
            fi

            mkdir -p meta
            printf '%s' "$version" > meta/VERSION

            # The publish job runs on a bare Alpine image with no checkout, so
            # the notes are rendered here — where the version is known — and
            # travel with it in the workspace.
            sed "s/{{VERSION}}/$version/g" .circleci/release-notes.md > meta/release-notes.md

            echo "This pipeline builds Saule $version (tag v$version) from $CIRCLE_SHA1"
      - persist_to_workspace:
          root: .
          paths:
            - meta

  # ---------------------------------------------------------------------------
  # Release — build
  # ---------------------------------------------------------------------------

  # The three Linux triples, all on CircleCI's x86_64 Docker executor.
  #
  # aarch64 is cross-compiled rather than built on an Arm executor: `saule-cli`
  # and `saule-lsp` are pure Rust over libc — the SDL and minifb dependencies
  # in Cargo.lock belong to `saule-engine-lib`, which is an example package and
  # is not built here — so the cross build needs a linker and nothing else. It
  # is still *executed* before being shipped, under qemu-user, so it gets the
  # same version check as every other archive.
  build-linux:
    executor: rust
    parameters:
      triple:
        type: string
    environment:
      TRIPLE: << parameters.triple >>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Cross-compilation prerequisites
          command: |
            set -eu
            case "$TRIPLE" in
              # Statically linked: the one build that runs on distros whose
              # glibc is older than the builder's, and inside Alpine-based
              # containers.
              x86_64-unknown-linux-musl)
                apt-get update
                apt-get install -y --no-install-recommends musl-tools
                ;;
              aarch64-unknown-linux-gnu)
                apt-get update
                apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu qemu-user
                # Cargo wants the linker under the triple upper-cased with
                # underscores.
                echo 'export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$BASH_ENV"
                echo 'export EMULATOR=qemu-aarch64' >> "$BASH_ENV"
                ;;
            esac
            rustup target add "$TRIPLE"
      - run:
          name: Build, verify and archive
          no_output_timeout: 45m
          command: .circleci/build-unix.sh
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Both Apple triples. An Apple Silicon runner builds the x86_64 archive too —
  # the Rust toolchain cross-compiles between the two Apple targets out of the
  # box.
  #
  # The x86_64 binary's runtime check needs Rosetta, which a CI image is not
  # guaranteed to have. `build-unix.sh` warns loudly and ships the archive
  # unverified in that one case rather than either failing the release or
  # pretending it checked.
  build-macos:
    macos:
      xcode: 26.6.0
    resource_class: m4pro.medium
    parameters:
      triple:
        type: string
    environment:
      TRIPLE: << parameters.triple >>
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Rust toolchain
          command: |
            set -eu
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
            fi
            echo '. "$HOME/.cargo/env"' >> "$BASH_ENV"
            . "$HOME/.cargo/env"
            rustup target add "$TRIPLE"
            case "$TRIPLE" in
              x86_64-apple-darwin) echo 'export EMULATOR="arch -x86_64"' >> "$BASH_ENV" ;;
            esac
      - run:
          name: Build, verify and archive
          no_output_timeout: 45m
          command: .circleci/build-unix.sh
      - persist_to_workspace:
          root: .
          paths:
            - dist

  build-windows:
    executor:
      name: win/default
      size: medium
    environment:
      TRIPLE: x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Rust toolchain
          shell: powershell.exe
          command: |
            $ErrorActionPreference = 'Stop'
            if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
              Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
              ./rustup-init.exe -y --profile minimal --default-toolchain stable
            }
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            rustup target add $env:TRIPLE
      - run:
          name: Build, verify and archive
          shell: powershell.exe
          no_output_timeout: 45m
          command: |
            $ErrorActionPreference = 'Stop'
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"

            # The one input that decides what the binaries report. Everything
            # else — `saule --version`, `Saule.version`, the LSP handshake —
            # reads it back out of the binary.
            $version = (Get-Content meta/VERSION -Raw).Trim()
            $env:SAULE_VERSION = $version
            Write-Host "Building Saule $version for $env:TRIPLE"

            cargo build --release --locked --target $env:TRIPLE -p saule-cli -p saule-lsp
            if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }

            $bin = "target/$env:TRIPLE/release/saule.exe"
            $got = & $bin --version
            Write-Host "$bin --version -> $got"
            if ($got -ne "saule $version") { throw "expected 'saule $version', got '$got'" }

            $name = "saule-$version-$env:TRIPLE"
            $staging = "dist/$name"
            New-Item -ItemType Directory -Force -Path $staging | Out-Null
            Copy-Item "target/$env:TRIPLE/release/saule.exe","target/$env:TRIPLE/release/saule-lsp.exe" $staging
            Copy-Item README.md $staging
            if (Test-Path LICENSE) {
              Copy-Item LICENSE $staging
            } else {
              Write-Warning "no LICENSE file. Archives are not redistributable without one."
            }

            # Compress-Archive rather than 7z: it ships with PowerShell 5+, so
            # the executor needs nothing installed beyond rustup and MSVC.
            Compress-Archive -Path $staging -DestinationPath "dist/$name.zip" -Force
            Remove-Item -Recurse -Force $staging
            Get-ChildItem dist
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # ---------------------------------------------------------------------------
  # Release — publish
  # ---------------------------------------------------------------------------

  # Creates the tag and the GitHub Release in one API call and uploads the
  # seven assets. This is the only job that writes anything outside CircleCI,
  # and it is the only one that needs a token.
  #
  # Under `dry-run: true` it still counts the archives and computes the
  # checksums — the two checks most likely to catch a broken matrix — and stops
  # before the first request to GitHub.
  publish:
    docker:
      - image: alpine:3.20
    environment:
      GITHUB_REPO: lauriszz123/saule
    steps:
      - run:
          name: Tools
          # Ahead of `attach_workspace`, which needs tar and gzip.
          command: apk add --no-cache curl jq tar gzip coreutils
      - attach_workspace:
          at: .
      - run:
          name: Checksums, and refuse a partial set
          command: |
            set -eu
            VERSION="$(cat meta/VERSION)"
            cd dist

            # Checked before anything else touches the archives: a partial set
            # is worse than no release, because the installer would 404 for
            # whichever platform is missing and only for the users on it. Doing
            # this first is what makes the failure say so, rather than
            # surfacing as a sha256sum error about a glob that matched nothing.
            count="$(ls saule-*.tar.gz saule-*.zip 2>/dev/null | wc -l | tr -d ' ')"
            if [ "$count" -ne 6 ]; then
              echo "error: expected 6 archives, found $count. Refusing to publish a partial set." >&2
              ls -la
              exit 1
            fi

            # `install.sh` refuses to install anything it cannot verify against
            # this file, so it is a required asset rather than a nicety.
            #
            # The archives are listed explicitly rather than with `./*`: on a
            # re-run a stale SHA256SUMS would otherwise checksum itself.
            sha256sum saule-*.tar.gz saule-*.zip > SHA256SUMS
            cat SHA256SUMS
            echo "Saule $VERSION — 6 archives, checksummed."
      - run:
          name: Create the GitHub Release
          command: |
            set -eu

            if [ "<< pipeline.parameters.dry-run >>" = "true" ]; then
              echo "dry run: everything built and verified; publishing nothing."
              exit 0
            fi

            : "${GITHUB_TOKEN:?no GITHUB_TOKEN — add the saule-release context to this job (see CIRCLECI.md)}"

            VERSION="$(cat meta/VERSION)"
            TAG="v$VERSION"
            API="https://api.github.com/repos/$GITHUB_REPO"
            auth="Authorization: Bearer $GITHUB_TOKEN"
            accept="Accept: application/vnd.github+json"

            # A Release is published once. Re-running this job after a
            # successful publish would otherwise either duplicate assets or
            # replace the archives someone has already downloaded and
            # checksummed.
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" -H "$accept" "$API/releases/tags/$TAG")"
            if [ "$code" = "200" ]; then
              echo "error: a release already exists for $TAG. A published version is never rebuilt." >&2
              exit 1
            fi

            # `target_commitish` is what creates the tag: GitHub tags the
            # commit for us, so there is no push and no second pipeline. On the
            # re-cut path the tag already exists and this field is ignored.
            body="$(jq -n \
              --arg tag "$TAG" \
              --arg target "$CIRCLE_SHA1" \
              --arg name "Saule $VERSION" \
              --rawfile notes meta/release-notes.md \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $notes, draft: false, prerelease: false}')"

            echo "Creating release $TAG at $CIRCLE_SHA1"
            release="$(curl --fail-with-body -sS -X POST \
              -H "$auth" -H "$accept" \
              -d "$body" "$API/releases")"

            id="$(printf '%s' "$release" | jq -r '.id')"
            echo "release id $id"

            cd dist
            for f in saule-*.tar.gz saule-*.zip SHA256SUMS; do
              echo "uploading $f"
              curl --fail-with-body -sS -X POST \
                -H "$auth" -H "$accept" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" \
                "https://uploads.github.com/repos/$GITHUB_REPO/releases/$id/assets?name=$f" \
                > /dev/null
            done

            echo
            echo "Published: https://github.com/$GITHUB_REPO/releases/tag/$TAG"
            echo "The installer will pick this up as \`latest\` immediately."
      - store_artifacts:
          path: dist
          destination: release

workflows:
  # One workflow, two entry points, and no third: a push to `main`, or a
  # `dry-run: true` trigger from anywhere. Every other branch — `develop`
  # included — matches neither, so its pipeline contains no jobs and runs
  # nothing.
  #
  # A tag pipeline is not part of this design either: the publish job creates
  # the tag itself, so there is exactly one publisher and nothing to race with.
  release:
    when:
      or:
        - equal: [main, << pipeline.git.branch >>]
        - << pipeline.parameters.dry-run >>
    jobs:
      # The gate. `version` requires all three, so a red test suite means no
      # archives are built and no release is created — the tests are what
      # stands between a push to `main` and a published version.
      - test
      - test-engine
      - check-www
      - version:
          requires: [test, test-engine, check-www]
      - build-linux:
          requires: [version]
          matrix:
            parameters:
              triple:
                - x86_64-unknown-linux-gnu
                - x86_64-unknown-linux-musl
                - aarch64-unknown-linux-gnu
      - build-macos:
          requires: [version]
          matrix:
            parameters:
              triple:
                - aarch64-apple-darwin
                - x86_64-apple-darwin
      - build-windows:
          requires: [version]
      - publish:
          # Requiring the matrix alias waits on every triple in it.
          requires: [build-linux, build-macos, build-windows]
          # Holds GITHUB_TOKEN. Restrict it to this project, and ideally to a
          # protected branch — it is the only credential in the pipeline.
          context: saule-release
