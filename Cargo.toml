[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Cargo requires three semver components, but the toolchain's version has two
# (`26.7` — see crates/saule-version). This value carries exactly one piece of
# information: **the major component is the year of record**, the single place
# the year is written down. The build number here stays `0.0` because Cargo's
# copy is internal metadata that nothing user-facing ever prints; the real
# version is resolved at compile time by `saule-version`'s build script and is
# what `saule --version`, `Saule.version` and every release artifact report.
#
# In January: bump `26` to `27` here and nowhere else.
version = "26.0.0"
edition = "2024"
description = "Saule — a statically typed, class-oriented scripting language."
license = "MIT"

# The interpreter is a tree walker: `eval` calls `exec` calls `eval`, across
# half a dozen modules and two crates. Cargo's default release profile splits
# the work into 16 codegen units and skips cross-crate LTO, which is exactly
# the shape that stops those calls from inlining into each other. Turning both
# knobs measured 3-6% off every program in `benchmarks/` — small, but paid for
# once in build time rather than on every run.
[profile.release]
lto = "fat"
codegen-units = 1
