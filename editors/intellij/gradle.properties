# ── Saule IntelliJ plugin build configuration ────────────────────────────────
# Bump these in one place. See build.gradle.kts for how they are consumed.

pluginGroup   = com.saule
pluginVersion = 26.1

# The IntelliJ Platform to build & test against. 2024.2 == build 242.
# Any 2023.2+ IDE works at runtime (that is the LSP4IJ floor).
platformType    = IC
platformVersion = 2024.2

# LSP4IJ (Red Hat) — the LSP client this plugin rides on. It is a *runtime*
# dependency: users install it from JetBrains Marketplace (the <depends> in
# plugin.xml makes the IDE offer to do so automatically).
#
# Marketplace plugin id: com.redhat.devtools.lsp4ij
# Pick a version compatible with `platformVersion` above — check
# https://plugins.jetbrains.com/plugin/23257-lsp4ij/versions if the build
# complains the coordinate cannot be resolved.
#
# 0.20.x is the floor for `LSPFormattingFeature.getTabSize` / `getInsertSpaces`
# (see SauleFormattingFeature); older LSP4IJ has no way to override the
# formatting options it sends.
lsp4ijVersion = 0.20.1

# Compatibility range advertised in plugin.xml. Must be >= the major version of
# `platformVersion` above (building against 2024.2 ⇒ 242). To support older IDEs
# (LSP4IJ itself goes back to 2023.2 / build 232), lower BOTH platformVersion and
# this value together — e.g. platformVersion=2023.2 with pluginSinceBuild=232.
pluginSinceBuild = 242

# JVM used to compile the plugin (IntelliJ 2024.x runs on JBR 17/21).
javaVersion = 17

org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
kotlin.stdlib.default.dependency = false
